# Les posts Instagram de Leverculsec sont maintenant publiés par Utopia (module Réseaux, utopiacustom.world) :
# plus de déclenchement automatique ici (sinon chaque post partirait deux fois). Lancement à la main seulement.
name: Instagram scheduler (arrêté : remplacé par Utopia)
on:
  workflow_dispatch:
concurrency:
  group: insta-scheduler
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish what is due
        if: github.event.schedule != '17 5 * * 1'
        env:
          KEY: ${{ secrets.INSTA_ADMIN_KEY }}
        run: |
          test -n "$KEY" || { echo "Secret INSTA_ADMIN_KEY manquant"; exit 1; }
          curl -fsS --max-time 120 -H "X-Insta-Admin-Key: $KEY" https://leverculsec.com/api/insta/cron
      - name: Renew the Instagram token
        if: github.event.schedule == '17 5 * * 1'
        env:
          KEY: ${{ secrets.INSTA_ADMIN_KEY }}
        run: |
          test -n "$KEY" || { echo "Secret INSTA_ADMIN_KEY manquant"; exit 1; }
          curl -fsS --max-time 60 -H "X-Insta-Admin-Key: $KEY" https://leverculsec.com/api/insta/refresh-token
