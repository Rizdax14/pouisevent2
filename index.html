<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bière Leverculsec</title>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#080810"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="BL"/>
  <link rel="apple-touch-icon" href="/icons/icon-192.png"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#080810;color:#eeeef5;font-family:'Outfit',sans-serif;}
    #root{min-height:100vh;}
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="utopia-events.js?v=202605112145"></script>
  <script>
    if('serviceWorker' in navigator){
      window.addEventListener('load',()=>{
        navigator.serviceWorker.register('/sw.js').then(reg=>{
          // Check for updates immediately
          reg.update();
          // If a new SW is waiting, activate it right away
          reg.addEventListener('updatefound',()=>{
            const newSW=reg.installing;
            newSW.addEventListener('statechange',()=>{
              if(newSW.state==='installed'&&navigator.serviceWorker.controller){
                // New version available — reload to get fresh content
                window.location.reload();
              }
            });
          });
        });
        // If controller changes (new SW took over), reload
        navigator.serviceWorker.addEventListener('controllerchange',()=>{
          window.location.reload();
        });
      });
    }
  </script>
</body>
</html>
